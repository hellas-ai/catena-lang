[package]
name = "catena-gpu"
version = "0.1.0"
edition = "2024"
description = "Minimal GPU compiler for the Catena runtime"
repository = "https://github.com/hellas-ai/catena-lang"
license = "MIT OR Apache-2.0"

[dependencies]
catena-lang = { path = "../catena-lang" }
hexpr.workspace = true
metacat.workspace = true
open-hypergraphs.workspace = true
thiserror = "2.0.18"

[dev-dependencies]
anyhow = "1.0.101"
metacat.workspace = true

[features]
default = []
runtime-tests = []

[[test]]
name = "runtime"
path = "tests/runtime.rs"
required-features = ["runtime-tests"]
