[package]
name = "catena-lang"
version = "0.1.0"
edition = "2024"
autoexamples = false
description = "catena: the deterministic array language"
repository = "https://github.com/hellas-ai/catena-lang"
documentation = "https://docs.rs/catena-lang"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.57", features = ["derive"] }
hexpr.workspace = true
metacat.workspace = true
open-hypergraphs.workspace = true
open-hypergraphs-dot = { version = "0.2.4", features = ["svg"], optional = true }
thiserror = "2.0.18"

# for runtime
tempfile = "3.23.0"
libffi = "5.1.0"
libloading = "0.9.0"
libc = "0.2.183"
memmap2 = "0.9"
rustix = { version = "1.1", features = ["net"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
half = "2"

[features]
default = ["svg-reports"]
runtime-tests = []
experimental-catena-gpu = []
svg-reports = ["dep:open-hypergraphs-dot"]

[[example]]
name = "runtime"
path = "examples/runtime.rs"

[[example]]
name = "mem"
path = "examples/mem.rs"

[[example]]
name = "safe_runtime"
path = "examples/safe_runtime.rs"

[[test]]
name = "runtime"
path = "tests/runtime.rs"
required-features = ["runtime-tests"]

[[test]]
name = "safe_gpu_assets"
path = "tests/safe_gpu_assets.rs"
harness = false
required-features = ["runtime-tests"]

[[test]]
name = "safe_gpu_causal_lm"
path = "tests/safe_gpu_causal_lm.rs"
harness = false
required-features = ["runtime-tests"]
